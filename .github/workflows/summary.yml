name: Generate Travel Short Video

on:
  issues:
    types: [opened]

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
          pip install gTTS moviepy

      - name: Generate Short Video
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python script.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-short-video
          path: travel_short.mp4
