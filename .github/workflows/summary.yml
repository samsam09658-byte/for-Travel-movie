name: Generate Travel Short Audio

on:
  issues:
    types: [opened]

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install gTTS

      - name: Generate Short Audio
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python script.py

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-audio
          path: travel_short.mp3
